<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>个人中心 · 校园二手交易平台</title>
<style>body{font-family:-apple-system,"PingFang SC",sans-serif;max-width:480px;margin:32px auto;padding:0 16px}h1{font-size:18px}h2{font-size:15px;margin-top:20px}label{display:block;margin-top:10px;font-size:14px}input{width:100%;padding:8px;box-sizing:border-box;margin-top:4px}button,a.btn{display:inline-block;margin:14px 8px 0 0;padding:8px 16px;background:#0a66c2;color:#fff;text-decoration:none;border:none;font-size:14px}p.hint{font-size:13px;color:#777}a.back{font-size:13px}</style></head>
<body>
<a class="back" href="../index.html">← 返回原型入口</a>
<h1>个人中心</h1>
<h2>资料区</h2>
<form>
  <label>头像（jpg/png，≤2MB）<input type="file"></label>
  <label>昵称（2-20 字符）<input type="text" value="用户1234"></label>
  <label>个性签名<input type="text" value="毕业出物，诚心交易"></label>
  <label>手机号（账号标识，不可修改）<input type="tel" value="138****1234" disabled></label>
  <button type="submit">保存资料</button>
</form>
<h2>安全区</h2>
<form>
  <label>原密码<input type="password"></label>
  <label>新密码（8-20 位，含字母和数字）<input type="password"></label>
  <label>确认新密码<input type="password"></label>
  <button type="submit">修改密码</button>
</form>
<p class="hint">换绑手机号：第一版只读（可选功能）。</p>
<a class="btn" href="goods-mine.html">我的发布</a>
<a class="btn" href="order-list.html">我的订单</a>
<a class="btn" href="auth-login.html">退出登录（清除 Token 与会话）</a>
<!-- 对应 report/04 个人中心说明：资料区/安全区/流转关系 -->
</body>
</html>
