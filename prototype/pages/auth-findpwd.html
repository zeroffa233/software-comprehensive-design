<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>找回密码页 · 校园二手交易平台</title>
<style>body{font-family:-apple-system,"PingFang SC",sans-serif;max-width:420px;margin:32px auto;padding:0 16px}h1{font-size:18px}label{display:block;margin-top:12px;font-size:14px}input{width:100%;padding:8px;box-sizing:border-box;margin-top:4px}button{margin-top:16px;padding:8px 18px;background:#0a66c2;color:#fff;border:none;font-size:14px}p.hint{font-size:13px;color:#777}a.back{font-size:13px}</style></head>
<body>
<a class="back" href="../index.html">← 返回原型入口</a>
<h1>找回密码</h1>
<form>
  <label>手机号（仅向注册绑定手机号发送验证码）<input type="tel" required></label>
  <label>短信验证码（6 位，5 分钟有效）<input type="text" required><button type="button">获取验证码</button></label>
  <label>新密码（8-20 位，含字母和数字）<input type="password" required></label>
  <label>确认新密码<input type="password" required></label>
  <button type="submit">重置密码 → <a href="auth-login.html" style="color:#fff">返回登录页</a></button>
</form>
<p class="hint">重置成功后旧会话全部失效，需重新登录。</p>
<!-- 对应 report/04 找回密码条目（US-02）：验证码校验→设置新密码 -->
</body>
</html>
