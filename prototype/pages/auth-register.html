<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>注册页 · 校园二手交易平台</title>
<style>body{font-family:-apple-system,"PingFang SC",sans-serif;max-width:420px;margin:32px auto;padding:0 16px}h1{font-size:18px}label{display:block;margin-top:12px;font-size:14px}input{width:100%;padding:8px;box-sizing:border-box;margin-top:4px}button,a.btn{display:inline-block;margin-top:16px;padding:8px 18px;background:#0a66c2;color:#fff;text-decoration:none;border:none;font-size:14px}p.hint{font-size:13px;color:#777}a.back{font-size:13px}</style></head>
<body>
<a class="back" href="../index.html">← 返回原型入口</a>
<h1>注册页</h1>
<form>
  <label>手机号（11 位）<input type="tel" placeholder="请输入手机号" required></label>
  <label>短信验证码（6 位）<input type="text" placeholder="5 分钟内有效"><button type="button">获取验证码（60s 倒计时）</button></label>
  <label>密码（8-20 位，含字母和数字）<input type="password" placeholder="请设置密码" required></label>
  <label>确认密码<input type="password" required></label>
  <label><input type="checkbox" required> 同意《平台使用协议》</label>
  <button type="submit">注册（成功后自动登录 → 首页）</button>
</form>
<p class="hint">校验：手机号全平台唯一；验证码 Redis 5 分钟有效，同号 60s 一次；昵称默认"用户+手机号后四位"。失败提示：手机号已注册 / 验证码错误或过期 / 两次密码不一致。</p>
<p class="hint"><a href="auth-login.html">已有账号？去登录</a></p>
<!-- 对应 report/04 注册条目（US-01）：手机号+验证码注册，手机号唯一 -->
</body>
</html>
