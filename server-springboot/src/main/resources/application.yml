server:
  port: 8080

spring:
  application:
    name: campus-market-server
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/campus_market?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: campus-root-2026
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/schema.sql
      data-locations: classpath:db/migration/seed.sql
      continue-on-error: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

market:
  jwt:
    # HS256 密钥（>=32 字节）；正式环境用环境变量 JWT_SECRET 覆盖，严禁入库
    secret: ${JWT_SECRET:campus-market-dev-2026-SECRET-KEY}
    expire-hours: 2
  upload-dir: ${UPLOAD_DIR:./uploads}
  agent:
    # Agent 对话真入口（FastAPI）
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8100}
    # agent-svc 服务账号（dev 约定凭证，登录签发 role=AGENT_SVC 令牌）
    svc-phone: ${AGENT_SVC_PHONE:13800000000}
    svc-password: ${AGENT_SVC_PASSWORD:Agent@2026}
